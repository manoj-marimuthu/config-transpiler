variant: flatcar
version: 1.0.0
passwd:
    users:
        - name: foobar
          gecos: Foo Bar. H
          groups:
            - devs
            - bosses
          shell: /bin/dash
          uid: 1004
          home_dir: /home/foobarhome
          system: true
        - name: barfoo
          gecos: Bar Foo. I
          groups:
            - devs
          shell: /bin/bash
          uid: 1768
          home_dir: /home/barfoohome
    groups:
        - name: devs
        - name: bosses
systemd:
    units:
        - name: cloud-init-runcmd-0.service
          enabled: true
          contents: |-
            [Unit]
            Description=cloud-init runcmd unit
            [Service]
            Type=oneshot
            ExecStart=/bin/sh -c 'echo hello'
            [Install]
            WantedBy=multi-user.target
        - name: cloud-init-runcmd-1.service
          enabled: true
          contents: |-
            [Unit]
            Description=cloud-init runcmd unit
            [Service]
            Type=oneshot
            ExecStart=ls -l
            [Install]
            WantedBy=multi-user.target
        - name: cloud-init-runcmd-2.service
          enabled: true
          contents: |-
            [Unit]
            Description=cloud-init runcmd unit
            [Service]
            Type=oneshot
            ExecStart=echo hi
            [Install]
            WantedBy=multi-user.target
storage:
    files:
        - path: /etc/demo1.txt
          mode: 420
          contents:
            inline: |
                Hello from demo1.txt,
                write_files test 1
          user:
            name: root
          group:
            name: root
        - path: /etc/demo2.conf
          mode: 493
          contents:
            inline: |
                Hello from demo2.conf,
                write_files test 2
          user:
            name: foobar
          group:
            name: devs
