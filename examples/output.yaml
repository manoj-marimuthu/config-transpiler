variant: flatcar
version: 1.0.0
passwd:
    users:
        - name: foobar
          gecos: Foo Bar. H
          groups:
            - devs
            - bosses
          shell: /bin/dash
          uid: 1004
        - name: barfoo
          gecos: Bar Foo. I
          groups:
            - devs
          shell: /bin/bash
          uid: 1768
    groups:
        - name: devs
        - name: bosses
systemd:
    units:
        - name: cloud-init-runcmd-0.service
          enabled: true
          contents: |-
            [Unit]
            Description=cloud-init runcmd unit

            [Service]
            Type=oneshot
            ExecStart=/bin/sh -c 'echo hello'

            [Install]
            WantedBy=multi-user.target
            			
        - name: cloud-init-runcmd-1.service
          enabled: true
          contents: |-
            [Unit]
            Description=cloud-init runcmd unit

            [Service]
            Type=oneshot
            ExecStart=/bin/sh -c 'echo bye'

            [Install]
            WantedBy=multi-user.target
            			
